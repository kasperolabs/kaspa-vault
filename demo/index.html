<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kaspa-vault demo (dev world, no money)</title>
<style>
  body { margin: 0; background: #f6f8fb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #0f172a; }
  main { padding: 32px 16px 120px; }
  #dev { position: fixed; left: 0; right: 0; bottom: 0; background: #0f172a; color: #e2e8f0; font-size: 13px; padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; z-index: 10; }
  #dev b { color: #fbbf24; margin-right: 6px; }
  #dev button { font: inherit; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  #dev button:hover { background: #334155; }
  #mail { position: fixed; right: 16px; bottom: 56px; width: min(520px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; background: #fff; border: 1px solid #e5e9f0; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.15); padding: 12px 16px; display: none; font-size: 13px; z-index: 11; }
  #mail pre { white-space: pre-wrap; font-size: 12px; background: #f8fafc; padding: 8px; border-radius: 8px; }
  #mail a { word-break: break-all; }
</style>
</head>
<body>
<main>
  <kaspa-vault watcher="http://127.0.0.1:7399" node="ws://127.0.0.1:18210" storage-key="kaspa-vault-devworld"></kaspa-vault>
</main>
<div id="dev"><b>DEV WORLD · no money</b>
  <button data-kas="10">Fund spending wallet 10 KAS</button>
  <button data-kas="100">… 100 KAS</button>
  <button data-adv="3100">Time +5 min</button>
  <button data-adv="864100">Time +1 day</button>
  <button id="mailbtn">Mailbox</button>
  <span id="devmsg"></span>
</div>
<div id="mail"></div>
<script type="module">
  import '../widget/dist/kaspa-vault.js';
  const CTL = 'http://127.0.0.1:7398';
  const el = document.querySelector('kaspa-vault');
  const msg = t => { document.getElementById('devmsg').textContent = t; };
  const hot = () => { try { return JSON.parse(localStorage.getItem('kaspa-vault-devworld')).card.addresses.hot; } catch (e) { return null; } };
  const post = (p, b) => fetch(CTL + p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then(r => r.json());
  document.getElementById('dev').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.kas) { const a = hot(); if (!a) return msg('open a vault first'); await post('/fund', { address: a, kas: b.dataset.kas }); msg(`+${b.dataset.kas} KAS`); el.refresh(); }
    if (b.dataset.adv) { const r = await post('/advance', { daa: b.dataset.adv }); msg(`DAA ${r.daa}`); setTimeout(() => el.refresh(), 300); }
    if (b.id === 'mailbtn') {
      const box = document.getElementById('mail');
      if (box.style.display === 'block') { box.style.display = 'none'; return; }
      const mails = await (await fetch(CTL + '/mail')).json();
      box.innerHTML = mails.length ? mails.slice().reverse().map(m => `<div><b>${m.subject}</b> · ${m.to}<pre>${m.text.replace(/</g, '&lt;').replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>')}</pre></div>`).join('') : 'No mail yet.';
      box.style.display = 'block';
    }
  });
</script>
</body>
</html>
