# /etc/nginx/sites-available/watch.kaspavault.com
# DNS: an A record for watch.kaspavault.com to this box, DNS only (grey cloud), so nginx sees real
# client addresses and certbot can issue the certificate. Then: certbot --nginx -d watch.kaspavault.com

limit_req_zone $binary_remote_addr zone=kv_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=kv_reg:10m rate=6r/m;

server {
    listen 80;
    server_name watch.kaspavault.com;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;

    location = /v1/register { limit_req zone=kv_reg burst=3 nodelay; proxy_pass http://127.0.0.1:7332; include /etc/nginx/kv-proxy.conf; }
    location = /v1/lost     { limit_req zone=kv_reg burst=3 nodelay; proxy_pass http://127.0.0.1:7332; include /etc/nginx/kv-proxy.conf; }
    location /               { limit_req zone=kv_api burst=20 nodelay; proxy_pass http://127.0.0.1:7332; include /etc/nginx/kv-proxy.conf; }
}

# /etc/nginx/kv-proxy.conf (create it with these three lines):
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_read_timeout 60s;
